name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor $GITHUB_SHA origin/main; then
            echo "❌ Tag $GITHUB_REF_NAME points to a commit not on main."
            echo "   Release tags must be on the main branch."
            echo "   Push the version bump via PR first, then tag."
            exit 1
          fi
      - name: Verify package versions match tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="$GITHUB_REF_NAME"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

  build-binaries:
    name: Build Binaries
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            pkg: cli-darwin-arm64
            artifact: tps-darwin-arm64
          - target: bun-darwin-x64
            pkg: cli-darwin-x64
            artifact: tps-darwin-x64
          - target: bun-linux-arm64
            pkg: cli-linux-arm64
            artifact: tps-linux-arm64
          - target: bun-linux-x64
            pkg: cli-linux-x64
            artifact: tps-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          cd packages/agent && bun run build
          cd ../cli && bun run build
          (cd ../pi-tps-mail && bun run build) || true
      - name: Build ${TARGET}
        env:
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
          ART: ${{ matrix.artifact }}
        run: |
          bun run --filter @tpsdev-ai/cli build:binary:${TARGET#bun-}
          # build-portable.ts writes dist/tps-<platform> (the target minus its "bun-"
          # prefix). Every matrix row sets artifact to exactly that name, so SRC and DST
          # are the SAME FILE and an unconditional cp fails with "are the same file",
          # exit 1. That is what broke the v0.6.0 run — and it would have broken every
          # release since the output path settled, had one been cut. Copy only when the
          # paths genuinely differ, so a future matrix row that names them apart works.
          SRC="packages/cli/dist/tps-${TARGET#bun-}"
          DST="packages/cli/dist/${ART}"
          [ "$SRC" = "$DST" ] || cp "$SRC" "$DST"
          test -f "$DST" || { echo "::error::expected binary missing at $DST"; exit 1; }
          sha256sum "$DST" > "$DST.sha256"
      - name: Stage binary
        env:
          PKG: ${{ matrix.pkg }}
          ART: ${{ matrix.artifact }}
        run: |
          mkdir -p /tmp/release/${PKG}
          cp packages/cli/dist/${ART} /tmp/release/${PKG}/tps
          cp packages/cli/dist/${ART}.sha256 /tmp/release/${PKG}/${ART}.sha256
          chmod +x /tmp/release/${PKG}/tps
          cp packages/${PKG}/README.md /tmp/release/${PKG}/README.md
      - name: Upload staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.pkg }}
          path: /tmp/release/${{ matrix.pkg }}
          if-no-files-found: error

  smoke-compiled-binary:
    name: Smoke compiled binary
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          cd packages/agent && bun run build
          cd ../cli && bun run build
          (cd ../pi-tps-mail && bun run build) || true
      - name: Build linux-x64 release binary
        run: |
          bun run --filter @tpsdev-ai/cli build:binary:linux-x64
          cp packages/cli/dist/tps-linux-x64 /tmp/tps-release-smoke
          chmod +x /tmp/tps-release-smoke
      - name: Smoke test --version
        run: |
          VERSION_OUTPUT=$(/tmp/tps-release-smoke --version)
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$VERSION_OUTPUT" != "$PKG_VERSION" ]; then
            echo "❌ version mismatch: binary=$VERSION_OUTPUT package=$PKG_VERSION"
            exit 1
          fi
          echo "✅ --version OK"
      - name: Smoke test identity init
        run: |
          export HOME=$(mktemp -d)
          export TPS_VAULT_KEY="ci-release-smoke"
          /tmp/tps-release-smoke identity init --json > /tmp/tps-identity.json
          FP=$(node -p "try { JSON.parse(require('fs').readFileSync('/tmp/tps-identity.json','utf8')).fingerprint } catch(e) { '' }")
          if [ -z "$FP" ]; then
            echo "❌ identity init failed"
            exit 1
          fi
          echo "✅ identity init OK (fingerprint: $FP)"
      - name: Smoke test Noise handshake
        run: |
          export HOME=$(mktemp -d)
          export TPS_VAULT_KEY="ci-release-smoke"
          timeout 15 /tmp/tps-release-smoke branch init --name release-smoke 2>&1 | tee /tmp/tps-branch.log || true
          if grep -qE "Branch identity created|Listening on" /tmp/tps-branch.log; then
            echo "✅ Noise handshake OK"
          else
            echo "❌ Noise handshake failed"
            exit 1
          fi
      - name: Smoke test no baked paths
        run: |
          if grep -q "/home/runner" /tmp/tps-release-smoke; then
            echo "❌ Found /home/runner references in binary"
            exit 1
          fi
          echo "✅ No baked CI paths"

  publish-packages:
    name: Publish npm packages
    needs: [build-binaries, smoke-compiled-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # NO registry-url. It makes setup-node write an .npmrc containing
          # _authToken=${NODE_AUTH_TOKEN} + always-auth, so with no token set npm
          # tries the EMPTY token and fails rather than falling through to OIDC.
          # That is exactly how the v0.6.0 publish failed: E404 on PUT, which is
          # npm's unauthorized response, not a missing package. OIDC needs no token
          # config at all; npm defaults to registry.npmjs.org.
      - name: Upgrade npm to an OIDC/staging-capable version
        # OIDC trusted publishing needs npm >= 11.5.1; `npm stage` needs >= 11.15.0.
        # The bundled npm is older, so upgrade explicitly rather than hoping.
        run: |
          npm install -g npm@^11.15.0
          echo "npm $(npm --version)"
      - name: Restore binary payloads into workspace
        run: |
          cp -R /tmp/release/cli-darwin-arm64/. packages/cli-darwin-arm64/
          cp -R /tmp/release/cli-darwin-x64/. packages/cli-darwin-x64/
          cp -R /tmp/release/cli-linux-arm64/. packages/cli-linux-arm64/
          cp -R /tmp/release/cli-linux-x64/. packages/cli-linux-x64/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build agent package
        run: bun run --filter @tpsdev-ai/agent build
      - name: Verify ALL workspace versions match the tag
        # The release preflight checks packages/cli only. That is how main ended up
        # with cli/agent at 0.5.5 and the four platform packages still at 0.5.4 —
        # a split that would have published a 0.6.0 CLI whose exact
        # optionalDependencies pins resolve to 0.5.4 binaries. Check all six.
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          # PARTIAL STAGE IS POSSIBLE AND IS NOT SELF-HEALING. If package 4 of 6
          # fails, packages 1-3 stay staged; npm offers no cleanup, no resume and
          # no idempotency, and CI cannot inspect or reject stages over OIDC. The
          # error path below therefore carries the operator recovery procedure
          # rather than telling someone to "inspect the staging area" and leaving
          # them to work out how. Automating it is tracked in cli#366.
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKGS=(cli agent cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64)
          for p in "${PKGS[@]}"; do
            pv="$(node -p "require('./packages/$p/package.json').version")"
            nm="$(node -p "require('./packages/$p/package.json').name")"
            if [ "$pv" != "$VERSION" ]; then
              echo "::error::$nm is at $pv, expected $VERSION (tag ${GITHUB_REF_NAME})."
              exit 1
            fi
            echo "  ok $nm @ $pv"
          done
          # The optionalDependencies pins are exact and must move with them.
          for p in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64; do
            # `?? ''` matters: a bare lookup on an absent key throws TypeError under
            # set -e, turning the intended ::error:: into a stack trace.
            pin="$(node -p "require('./packages/cli/package.json').optionalDependencies?.['@tpsdev-ai/$p'] ?? ''")"
            if [ -z "$pin" ]; then
              echo "::error::packages/cli has no optionalDependencies pin for @tpsdev-ai/$p."
              exit 1
            fi
            if [ "$pin" != "$VERSION" ]; then
              echo "::error::packages/cli pins @tpsdev-ai/$p at $pin, expected $VERSION."
              exit 1
            fi
            echo "  ok pin @tpsdev-ai/$p @ $pin"
          done

      - name: Stage-publish all packages (OIDC trusted publishing)
        id: stage
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        # Was: three steps of `npm publish` authenticated by secrets.NPM_TOKEN.
        # Two changes, both deliberate:
        #
        # 1. OIDC instead of a token. No long-lived credential lives in this repo.
        #    The February token expired silently and nobody learned that until the
        #    next release attempt — seven months later.
        #
        # 2. `npm stage publish` instead of `npm publish`. The token path went LIVE
        #    immediately, so the CLI had no human gate at all. Staging adds one:
        #    `--tag staged` leaves `latest` unmoved and nothing ships until a
        #    maintainer approves in npm.
        #
        #    NOT full parity with flair, and the difference is worth stating rather
        #    than glossing. flair pins `environment: release`, which scopes its
        #    trusted-publisher trust to that environment. This job has no
        #    environment, so the trust scope is broader: any run of this workflow on
        #    this repo can mint a publishing token. That is a deliberate trade —
        #    one fewer piece of repo config to keep in sync — and it is weaker.
        #    Tightening it is a follow-up, and needs the environment created first.
        #
        #    WHAT APPROVAL ACTUALLY DOES — stated correctly because an earlier
        #    draft of this comment had it backwards, and this comment is what tells
        #    the approving human what their approval means.
        #
        #    `--tag` is an IMMUTABLE property of a staged package and
        #    `npm stage approve` has no tag flag (npm 11.19.0: it accepts only
        #    --otp and --registry). We stage with `--tag staged`, so approval
        #    publishes the version PUBLICLY UNDER `staged` — it does NOT move
        #    `latest`. Our own flair pipeline documents the same behaviour from
        #    production (flair#1686): "After a maintainer approves, the version is
        #    public but NOT latest".
        #
        #    So `npm install -g @tpsdev-ai/cli` keeps serving the previous version
        #    until a maintainer explicitly runs:
        #
        #        npm dist-tag add @tpsdev-ai/cli@<version> latest
        #
        #    That promote is BY HAND for now. flair automates it with a sha-bound
        #    promote after a canary; this repo deliberately ships without that
        #    tooling, tracked in cli#366. Anyone approving a release here must know
        #    the promote is a separate, manual step, or they will approve, see the
        #    old version still installing, and conclude the pipeline failed. The gate is a human decision,
        #    not a policy.
        #
        # Dependency order: the platform binaries first, then agent, then cli last —
        # cli pins the platform packages at exact versions.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGED=()
          SKIPPED=()
          # A partial stage can be produced by EITHER a later package's auth failure OR an
          # E409 collision, so both failure branches hand the operator the same recovery
          # procedure. Keeping it in one place stops the two paths drifting apart.
          stage_recovery() {
            echo "::error::RECOVERY, from a machine logged in to npm:"
            echo "::error::  npm stage list @tpsdev-ai/cli          # see what is pending"
            echo "::error::  npm stage view <stage-id>              # confirm version + contents"
            echo "::error::then EITHER reject every pending stage for this version and re-run"
            echo "::error::the tag clean:"
            echo "::error::  npm stage reject <stage-id>            # for each staged package"
            echo "::error::OR approve the ones already staged and let this re-run stage only"
            echo "::error::the remainder — the already-PUBLISHED branch above will skip them."
            echo "::error::"
            echo "::error::Do NOT leave a partial stage pending: packages/cli pins the platform"
            echo "::error::binaries at exact versions, so a half-approved set publishes a CLI"
            echo "::error::whose dependencies do not exist. All six go together."
          }
          # Discloses, for ANY terminal failure, the packages this run already staged.
          # That fact is cause-independent, so every terminal branch calls this FIRST and
          # the collision DIAGNOSIS stays confined to the collision branch. Printing
          # nothing when STAGED is empty keeps it silent on the clean cases. A terminal
          # branch added later cannot forget it by accident — forgetting it means
          # deleting a call, not failing to add one.
          disclose_pending() {
            if [ "${#STAGED[@]}" -gt 0 ]; then
              echo "::error::PARTIAL STAGE: ${#STAGED[@]} package(s) were staged before this failure and"
              echo "::error::are still pending:"
              echo "::error::  ${STAGED[*]}"
              echo "::error::Clear or approve them BEFORE re-running, or the re-run fails at the first"
              echo "::error::already-staged package with an E409 collision, never reaching this one."
              echo "::error::"
            fi
          }
          for p in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 agent cli; do
            nm="$(node -p "require('./packages/$p/package.json').name")"
            echo "::group::npm stage publish — $nm (packages/$p)"
            # Capture npm's OWN output, so the failure branch below can branch on the
            # error CODE npm reports rather than on the exit status alone. Exit status
            # cannot tell an auth failure from a stage collision, and naming the wrong
            # cause sends an operator hunting for a pending stage that does not exist.
            set +e
            out="$( cd "packages/$p" && npm stage publish --tag staged --access public 2>&1 )"
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -eq 0 ]; then
              echo "  staged $nm@$VERSION"
              STAGED+=("$nm")
            elif npm view "$nm@$VERSION" version >/dev/null 2>&1; then
              # Already live. The old token path had this skip and the first draft of
              # this step dropped it, which would have made a re-run after a partial
              # failure die at the first package — the exact situation this workflow
              # has to survive, since v0.6.0 failed mid-flight.
              echo "  already PUBLISHED $nm@$VERSION — skipping"
              SKIPPED+=("$nm")
            else
              codes="$(printf '%s\n' "$out" | awk '/npm error code /{print $4}' | sort -u | paste -sd, -)"
              if printf '%s\n' "$out" | grep -qE 'ENEEDAUTH|E401|E403'; then
                # Authentication failure for THIS package: npm never got far enough to
                # look at the stage index, so the remedy is the trust relationship, not
                # the staging area. Disclosure comes first (pending packages are
                # cause-independent); then the recovery procedure, then the per-package
                # registration checklist.
                disclose_pending
                echo "::error::stage publish failed for $nm@$VERSION and it is not published."
                echo "::error::npm reported an authentication failure (${codes:-no error code parsed}) — OIDC"
                echo "::error::did not authenticate for this package."
                echo "::error::"
                if [ "${#STAGED[@]}" -gt 0 ]; then
                  stage_recovery
                  echo "::error::"
                fi
                echo "::error::Check, for THIS exact package name ($nm):"
                echo "::error::  - a Trusted Publisher registration exists for $nm on npmjs.com,"
                echo "::error::    with repository + workflow filename matching this job (trust is"
                echo "::error::    per package, so a missing registration affects only $nm)"
                echo "::error::  - this job declares permissions: id-token: write (it mints the"
                echo "::error::    OIDC token npm swaps for a short-lived publish credential)"
                echo "::error::  - npm is new enough — OIDC trusted publishing needs >= 11.5.1 and"
                echo "::error::    the stage subcommands need >= 11.15.0 (the upgrade step pins"
                echo "::error::    ^11.15.0)"
                echo "::error::"
                echo "::error::Fix the registration or the OIDC claim, then re-run this tag."
                exit 1
              elif printf '%s\n' "$out" | grep -qE 'E409|EPUBLISHCONFLICT|already exists|already staged'; then
                # A stage collision — the case this recovery block is written for.
                # npm-stage(1): staged versions share the semver unique index with
                # published ones, so re-staging errors. CI cannot resolve it itself
                # because a token issued through a trust relationship cannot run the
                # `npm stage` subcommands (list/view/reject/approve) AT ALL. That is a
                # separate rule from 2FA — per npm-stage(1) only approve and reject
                # need interactive proof-of-presence; list and view do not — but the
                # trust-relationship rule covers all four, so CI cannot inspect or
                # reject a stage. Name the ambiguity instead of guessing at it.
                disclose_pending
                echo "::error::stage publish failed for $nm@$VERSION and it is not published."
                echo "::error::npm reported ${codes:-a conflict} — most likely it is ALREADY STAGED from"
                echo "::error::a previous run of this tag."
                echo "::error::"
                echo "::error::Why CI cannot resolve this itself: npm-stage(1) shares the semver"
                echo "::error::unique index between staged and published versions, and a token issued"
                echo "::error::through a trust relationship cannot run the stage subcommands"
                echo "::error::(list/view/reject/approve) at all — so this workflow cannot inspect or"
                echo "::error::reject a staged package from CI. (2FA is not the reason: list and view"
                echo "::error::need no proof-of-presence; only approve and reject do.)"
                echo "::error::"
                stage_recovery
                exit 1
              else
                # No diagnosis for this code. Say so rather than asserting the
                # stage-collision cause, which is what the first real run proved wrong.
                # Still disclose any pending packages: that fact is cause-independent,
                # and withholding it here — the catch-all branch — is what hides a
                # partial stage. Only the COLLISION DIAGNOSIS is withheld.
                disclose_pending
                echo "::error::stage publish failed for $nm@$VERSION and it is not published."
                echo "::error::npm error code(s): ${codes:-none reported in npm output}"
                echo "::error::The cause is UNCLASSIFIED — this workflow has no diagnosis for this"
                echo "::error::code. Read the npm output above and diagnose from it; do not assume a"
                echo "::error::staged collision. The staging recovery block deliberately does not run."
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
          {
            echo "staged_count=${#STAGED[@]}"
            echo "skipped_count=${#SKIPPED[@]}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # Counts accumulated by the stage step. Reported separately so a partial run
          # neither claims all six were staged nor claims nothing is live when some
          # packages were skipped as already published.
          STAGED_COUNT: ${{ steps.stage.outputs.staged_count }}
          SKIPPED_COUNT: ${{ steps.stage.outputs.skipped_count }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGED_COUNT="${STAGED_COUNT:-0}"
          SKIPPED_COUNT="${SKIPPED_COUNT:-0}"
          {
            echo "### 📦 v$VERSION staged (tag: staged)"
            echo ""
            echo "**$STAGED_COUNT staged**, **$SKIPPED_COUNT skipped** (six packages attempted)."
            if [ "$SKIPPED_COUNT" -eq 0 ]; then
              echo ""
              echo "**Nothing is live yet.**"
            else
              echo ""
              echo "The $SKIPPED_COUNT skipped packages were already published — those are live."
            fi
            # Approval only applies when something was staged. Promotion, however, is
            # the remaining step whenever ANY package exists for this version — including
            # the re-run where all six were already published (STAGED=0, SKIPPED=6) and
            # `latest` still points at the previous version. The two instructions have
            # different preconditions, so they must not share one condition.
            if [ "$STAGED_COUNT" -gt 0 ]; then
              echo ""
              echo "**Approve:** a maintainer approves the staged release in npm (2FA). The version"
              echo "then becomes public **under the \`staged\` dist-tag** — \`latest\` does NOT move."
            fi
            if [ "$STAGED_COUNT" -gt 0 ] || [ "$SKIPPED_COUNT" -gt 0 ]; then
              echo ""
              echo "**Promote:** to make \`npm install\` serve this version, a maintainer runs, per package:"
              echo "  \`npm dist-tag add @tpsdev-ai/cli@$VERSION latest\`"
              echo ""
              echo "Until that promote, \`npm install -g @tpsdev-ai/cli\` keeps serving the previous version."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release checksums
    # ORDERING, decided explicitly (raised in review of #365): this fires as soon
    # as staging succeeds, so a GitHub release exists while npm still serves the
    # previous version. That is intended. The binaries it publishes are real
    # artifacts built and smoke-tested in this run; their existence does not
    # depend on the npm approval. Gating it on approval is not possible from here
    # anyway — approval happens out-of-band in npm and this workflow has no way to
    # observe it without polling.
    #
    # The consequence to be aware of: between staging and approval, the GitHub
    # release advertises a version `npm install` will not yet give you.
    needs: [build-binaries, publish-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/release
      - name: Create release artifacts
        run: |
          cat /tmp/release/cli-darwin-arm64/tps-darwin-arm64.sha256
          cat /tmp/release/cli-darwin-x64/tps-darwin-x64.sha256
          cat /tmp/release/cli-linux-arm64/tps-linux-arm64.sha256
          cat /tmp/release/cli-linux-x64/tps-linux-x64.sha256
      - name: Publish checksums to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            /tmp/release/cli-darwin-arm64/tps-darwin-arm64
            /tmp/release/cli-darwin-arm64/tps-darwin-arm64.sha256
            /tmp/release/cli-darwin-x64/tps-darwin-x64
            /tmp/release/cli-darwin-x64/tps-darwin-x64.sha256
            /tmp/release/cli-linux-arm64/tps-linux-arm64
            /tmp/release/cli-linux-arm64/tps-linux-arm64.sha256
            /tmp/release/cli-linux-x64/tps-linux-x64
            /tmp/release/cli-linux-x64/tps-linux-x64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
