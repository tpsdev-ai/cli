name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify tag is on main
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor $GITHUB_SHA origin/main; then
            echo "❌ Tag $GITHUB_REF_NAME points to a commit not on main."
            echo "   Release tags must be on the main branch."
            echo "   Push the version bump via PR first, then tag."
            exit 1
          fi
      - name: Verify package versions match tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="$GITHUB_REF_NAME"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

  build-binaries:
    name: Build Binaries
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            pkg: cli-darwin-arm64
            artifact: tps-darwin-arm64
          - target: bun-darwin-x64
            pkg: cli-darwin-x64
            artifact: tps-darwin-x64
          - target: bun-linux-arm64
            pkg: cli-linux-arm64
            artifact: tps-linux-arm64
          - target: bun-linux-x64
            pkg: cli-linux-x64
            artifact: tps-linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          cd packages/agent && bun run build
          cd ../cli && bun run build
          (cd ../pi-tps-mail && bun run build) || true
      - name: Build ${TARGET}
        env:
          TARGET: ${{ matrix.target }}
          PKG: ${{ matrix.pkg }}
          ART: ${{ matrix.artifact }}
        run: |
          bun run --filter @tpsdev-ai/cli build:binary:${TARGET#bun-}
          # build-portable.ts writes dist/tps-<platform> (the target minus its "bun-"
          # prefix). Every matrix row sets artifact to exactly that name, so SRC and DST
          # are the SAME FILE and an unconditional cp fails with "are the same file",
          # exit 1. That is what broke the v0.6.0 run — and it would have broken every
          # release since the output path settled, had one been cut. Copy only when the
          # paths genuinely differ, so a future matrix row that names them apart works.
          SRC="packages/cli/dist/tps-${TARGET#bun-}"
          DST="packages/cli/dist/${ART}"
          [ "$SRC" = "$DST" ] || cp "$SRC" "$DST"
          test -f "$DST" || { echo "::error::expected binary missing at $DST"; exit 1; }
          sha256sum "$DST" > "$DST.sha256"
      - name: Stage binary
        env:
          PKG: ${{ matrix.pkg }}
          ART: ${{ matrix.artifact }}
        run: |
          mkdir -p /tmp/release/${PKG}
          cp packages/cli/dist/${ART} /tmp/release/${PKG}/tps
          cp packages/cli/dist/${ART}.sha256 /tmp/release/${PKG}/${ART}.sha256
          chmod +x /tmp/release/${PKG}/tps
          cp packages/${PKG}/README.md /tmp/release/${PKG}/README.md
      - name: Upload staging artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.pkg }}
          path: /tmp/release/${{ matrix.pkg }}
          if-no-files-found: error

  smoke-compiled-binary:
    name: Smoke compiled binary
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          cd packages/agent && bun run build
          cd ../cli && bun run build
          (cd ../pi-tps-mail && bun run build) || true
      - name: Build linux-x64 release binary
        run: |
          bun run --filter @tpsdev-ai/cli build:binary:linux-x64
          cp packages/cli/dist/tps-linux-x64 /tmp/tps-release-smoke
          chmod +x /tmp/tps-release-smoke
      - name: Smoke test --version
        run: |
          VERSION_OUTPUT=$(/tmp/tps-release-smoke --version)
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$VERSION_OUTPUT" != "$PKG_VERSION" ]; then
            echo "❌ version mismatch: binary=$VERSION_OUTPUT package=$PKG_VERSION"
            exit 1
          fi
          echo "✅ --version OK"
      - name: Smoke test identity init
        run: |
          export HOME=$(mktemp -d)
          export TPS_VAULT_KEY="ci-release-smoke"
          /tmp/tps-release-smoke identity init --json > /tmp/tps-identity.json
          FP=$(node -p "try { JSON.parse(require('fs').readFileSync('/tmp/tps-identity.json','utf8')).fingerprint } catch(e) { '' }")
          if [ -z "$FP" ]; then
            echo "❌ identity init failed"
            exit 1
          fi
          echo "✅ identity init OK (fingerprint: $FP)"
      - name: Smoke test Noise handshake
        run: |
          export HOME=$(mktemp -d)
          export TPS_VAULT_KEY="ci-release-smoke"
          timeout 15 /tmp/tps-release-smoke branch init --name release-smoke 2>&1 | tee /tmp/tps-branch.log || true
          if grep -qE "Branch identity created|Listening on" /tmp/tps-branch.log; then
            echo "✅ Noise handshake OK"
          else
            echo "❌ Noise handshake failed"
            exit 1
          fi
      - name: Smoke test no baked paths
        run: |
          if grep -q "/home/runner" /tmp/tps-release-smoke; then
            echo "❌ Found /home/runner references in binary"
            exit 1
          fi
          echo "✅ No baked CI paths"

  publish-packages:
    name: Publish npm packages
    needs: [build-binaries, smoke-compiled-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          # NO registry-url. It makes setup-node write an .npmrc containing
          # _authToken=${NODE_AUTH_TOKEN} + always-auth, so with no token set npm
          # tries the EMPTY token and fails rather than falling through to OIDC.
          # That is exactly how the v0.6.0 publish failed: E404 on PUT, which is
          # npm's unauthorized response, not a missing package. OIDC needs no token
          # config at all; npm defaults to registry.npmjs.org.
      - name: Upgrade npm to an OIDC/staging-capable version
        # OIDC trusted publishing needs npm >= 11.5.1; `npm stage` needs >= 11.15.0.
        # The bundled npm is older, so upgrade explicitly rather than hoping.
        run: |
          npm install -g npm@^11.15.0
          echo "npm $(npm --version)"
      - name: Restore binary payloads into workspace
        run: |
          cp -R /tmp/release/cli-darwin-arm64/. packages/cli-darwin-arm64/
          cp -R /tmp/release/cli-darwin-x64/. packages/cli-darwin-x64/
          cp -R /tmp/release/cli-linux-arm64/. packages/cli-linux-arm64/
          cp -R /tmp/release/cli-linux-x64/. packages/cli-linux-x64/
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build agent package
        run: bun run --filter @tpsdev-ai/agent build
      - name: Verify ALL workspace versions match the tag
        # The release preflight checks packages/cli only. That is how main ended up
        # with cli/agent at 0.5.5 and the four platform packages still at 0.5.4 —
        # a split that would have published a 0.6.0 CLI whose exact
        # optionalDependencies pins resolve to 0.5.4 binaries. Check all six.
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PKGS=(cli agent cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64)
          for p in "${PKGS[@]}"; do
            pv="$(node -p "require('./packages/$p/package.json').version")"
            nm="$(node -p "require('./packages/$p/package.json').name")"
            if [ "$pv" != "$VERSION" ]; then
              echo "::error::$nm is at $pv, expected $VERSION (tag ${GITHUB_REF_NAME})."
              exit 1
            fi
            echo "  ok $nm @ $pv"
          done
          # The optionalDependencies pins are exact and must move with them.
          for p in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64; do
            # `?? ''` matters: a bare lookup on an absent key throws TypeError under
            # set -e, turning the intended ::error:: into a stack trace.
            pin="$(node -p "require('./packages/cli/package.json').optionalDependencies?.['@tpsdev-ai/$p'] ?? ''")"
            if [ -z "$pin" ]; then
              echo "::error::packages/cli has no optionalDependencies pin for @tpsdev-ai/$p."
              exit 1
            fi
            if [ "$pin" != "$VERSION" ]; then
              echo "::error::packages/cli pins @tpsdev-ai/$p at $pin, expected $VERSION."
              exit 1
            fi
            echo "  ok pin @tpsdev-ai/$p @ $pin"
          done

      - name: Stage-publish all packages (OIDC trusted publishing)
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        # Was: three steps of `npm publish` authenticated by secrets.NPM_TOKEN.
        # Two changes, both deliberate:
        #
        # 1. OIDC instead of a token. No long-lived credential lives in this repo.
        #    The February token expired silently and nobody learned that until the
        #    next release attempt — seven months later.
        #
        # 2. `npm stage publish` instead of `npm publish`. The token path went LIVE
        #    immediately, so the CLI had no human gate at all. Staging adds one:
        #    `--tag staged` leaves `latest` unmoved and nothing ships until a
        #    maintainer approves in npm.
        #
        #    NOT full parity with flair, and the difference is worth stating rather
        #    than glossing. flair pins `environment: release`, which scopes its
        #    trusted-publisher trust to that environment. This job has no
        #    environment, so the trust scope is broader: any run of this workflow on
        #    this repo can mint a publishing token. That is a deliberate trade —
        #    one fewer piece of repo config to keep in sync — and it is weaker.
        #    Tightening it is a follow-up, and needs the environment created first.
        #
        #    WHAT APPROVAL ACTUALLY DOES — stated correctly because an earlier
        #    draft of this comment had it backwards, and this comment is what tells
        #    the approving human what their approval means.
        #
        #    `--tag` is an IMMUTABLE property of a staged package and
        #    `npm stage approve` has no tag flag (npm 11.19.0: it accepts only
        #    --otp and --registry). We stage with `--tag staged`, so approval
        #    publishes the version PUBLICLY UNDER `staged` — it does NOT move
        #    `latest`. Our own flair pipeline documents the same behaviour from
        #    production (flair#1686): "After a maintainer approves, the version is
        #    public but NOT latest".
        #
        #    So `npm install -g @tpsdev-ai/cli` keeps serving the previous version
        #    until a maintainer explicitly runs:
        #
        #        npm dist-tag add @tpsdev-ai/cli@<version> latest
        #
        #    That promote is BY HAND for now. flair automates it with a sha-bound
        #    promote after a canary; this repo deliberately ships without that
        #    tooling, tracked in cli#366. Anyone approving a release here must know
        #    the promote is a separate, manual step, or they will approve, see the
        #    old version still installing, and conclude the pipeline failed. The gate is a human decision,
        #    not a policy.
        #
        # Dependency order: the platform binaries first, then agent, then cli last —
        # cli pins the platform packages at exact versions.
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for p in cli-darwin-arm64 cli-darwin-x64 cli-linux-arm64 cli-linux-x64 agent cli; do
            nm="$(node -p "require('./packages/$p/package.json').name")"
            echo "::group::npm stage publish — $nm (packages/$p)"
            if ( cd "packages/$p" && npm stage publish --tag staged --access public ); then
              echo "  staged $nm@$VERSION"
            elif npm view "$nm@$VERSION" version >/dev/null 2>&1; then
              # Already live. The old token path had this skip and the first draft of
              # this step dropped it, which would have made a re-run after a partial
              # failure die at the first package — the exact situation this workflow
              # has to survive, since v0.6.0 failed mid-flight.
              echo "  already PUBLISHED $nm@$VERSION — skipping"
            else
              # It may already be STAGED. npm-stage(1): staged versions share the
              # semver unique index with published ones, so re-staging errors. We
              # cannot confirm it from CI — `npm stage list` needs interactive
              # proof-of-presence and cannot use OIDC — so name the ambiguity
              # instead of guessing at it.
              echo "::error::stage publish failed for $nm@$VERSION and it is not published."
              echo "::error::It may already be STAGED; npm stage list requires interactive auth so CI cannot check. Inspect the staging area before re-running."
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Summary
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "### 📦 v$VERSION staged (tag: staged)"
            echo ""
            echo "Six packages staged via OIDC trusted publishing. **Nothing is live yet.**"
            echo ""
            echo "Two steps remain, and they are separate:"
            echo "1. A maintainer approves the staged release in npm (2FA). The version then"
            echo "   becomes public **under the \`staged\` dist-tag** — \`latest\` does NOT move."
            echo "2. To make \`npm install\` serve it, a maintainer runs:"
            echo "   \`npm dist-tag add @tpsdev-ai/cli@$VERSION latest\` (per package)."
            echo ""
            echo "Until step 2, \`npm install -g @tpsdev-ai/cli\` keeps serving the previous version."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub release checksums
    # ORDERING, decided explicitly (raised in review of #365): this fires as soon
    # as staging succeeds, so a GitHub release exists while npm still serves the
    # previous version. That is intended. The binaries it publishes are real
    # artifacts built and smoke-tested in this run; their existence does not
    # depend on the npm approval. Gating it on approval is not possible from here
    # anyway — approval happens out-of-band in npm and this workflow has no way to
    # observe it without polling.
    #
    # The consequence to be aware of: between staging and approval, the GitHub
    # release advertises a version `npm install` will not yet give you.
    needs: [build-binaries, publish-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/release
      - name: Create release artifacts
        run: |
          cat /tmp/release/cli-darwin-arm64/tps-darwin-arm64.sha256
          cat /tmp/release/cli-darwin-x64/tps-darwin-x64.sha256
          cat /tmp/release/cli-linux-arm64/tps-linux-arm64.sha256
          cat /tmp/release/cli-linux-x64/tps-linux-x64.sha256
      - name: Publish checksums to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            /tmp/release/cli-darwin-arm64/tps-darwin-arm64
            /tmp/release/cli-darwin-arm64/tps-darwin-arm64.sha256
            /tmp/release/cli-darwin-x64/tps-darwin-x64
            /tmp/release/cli-darwin-x64/tps-darwin-x64.sha256
            /tmp/release/cli-linux-arm64/tps-linux-arm64
            /tmp/release/cli-linux-arm64/tps-linux-arm64.sha256
            /tmp/release/cli-linux-x64/tps-linux-x64
            /tmp/release/cli-linux-x64/tps-linux-x64.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
