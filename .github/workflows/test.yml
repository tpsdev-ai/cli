name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job inherits any scope; each job below declares exactly
# what its steps use.
permissions: {}

jobs:
  build:
    name: Build (TypeScript strict)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build

  lint:
    name: Lint (Biome)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - name: nono pin gate (cli#341 S4)
        run: ./scripts/check-nono-pin.sh
      - name: nono pin gate — fails-first fixtures (cli#341 S4)
        run: ./scripts/test-check-nono-pin.sh
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run lint:ci

  # cli#366 — the promote script must run under bash 3.2, which is the bash on the
  # machine that drives releases (macOS still ships 3.2.57). Fixtures that only ever
  # run on Linux cannot protect it, so this runs on macOS too, with BASH_BIN pinned
  # to the runner's own bash so a PATH change cannot silently substitute bash 4/5
  # and hide a 3.2 regression.
  promote-latest-fixtures:
    name: promote-latest fixtures (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Run the promote-latest fixtures under this runner's bash
        env:
          BASH_BIN: ${{ runner.os == 'macOS' && '/bin/bash' || 'bash' }}
        run: |
          "$BASH_BIN" --version | head -n1
          "$BASH_BIN" ./scripts/test-promote-latest.sh

  test:
    name: Unit & Integration Tests
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      - run: |
          chmod +x packages/cli/test/fakes/nono/bin/nono 2>/dev/null || true
      - run: bun run test
      - name: openclaw-tps-mail plugin tests (isolated HOME launcher)
        # cli#398: the plugin's outbox/archive writers resolve ~/.tps and the CLI
        # mail dirs from the process HOME, so the suite MUST run through its
        # launcher (plugins/openclaw-tps-mail/scripts/run-tests.mjs), which sets a
        # throwaway HOME/TPS_MAIL_DIR/TPS_TEST_KEYS_DIR at launch time. A bare
        # `bun test` aborts by name in the test preload before any module loads.
        working-directory: plugins/openclaw-tps-mail
        run: |
          npm ci --ignore-scripts   # frozen, from the plugin's own package-lock.json — NEVER a bun install that writes a lockfile
          npm run build             # tsc — REQUIRED: the node-load tests read the built dist/src/index.js
          bun run test              # the isolated launcher (see scripts/run-tests.mjs)
      # cli#411 — the guard runs LAST, with `if: always()`, so a failing suite
      # step cannot skip it. It is never a clause of a suite: a guard that ran
      # inside one could be taken down by dropping that suite, which is the
      # failure it exists to catch. It does not read this file — it MEASURES what
      # ran, from the JUnit report each suite writes to test-reports/<suite>.xml
      # via scripts/test-suite.mjs (the plugin's launcher sets the same flags for
      # its own run), and each launcher deletes its own suite's report before that
      # suite starts, so a stale report cannot stand in for this run's. A required
      # report that is missing or empty fails it closed, and every test file it
      # discovers that no report shows executed is named.
      - name: Every test file is run by a suite CI runs (cli#411)
        if: always()
        run: node scripts/check-test-reports.mjs

  # cli#394 — the openclaw-tps-mail plugin is otherwise outside CI (#393), so a
  # `bun:` import reachable from the CLI's archive util could break the gateway's
  # (node) plugin load with every test still green under `bun test`. This job
  # builds the workspace + plugin and imports the BUILT plugin entry under real
  # `node` — the one assertion that reproduces the failure that took reviewer
  # mail down. The plugin's tsc is GREEN after cli#393, so its build is
  # mandatory here (a compile failure must fail the job, never be swallowed).
  node-plugin-load:
    name: Node plugin load (openclaw-tps-mail)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code + npm lifecycle scripts must not see the token
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      - name: Show the node that the gateway analog runs under
        run: node --version
      - name: Install + build the plugin
        working-directory: plugins/openclaw-tps-mail
        run: |
          npm ci --ignore-scripts # frozen, from the plugin's own package-lock.json; deps are file: links + the SDK; no lifecycle scripts on PR-controlled code
          npm run build           # tsc is GREEN after cli#393 — a compile failure MUST fail the job, never be swallowed
          test -f dist/src/index.js
      - name: Import the built plugin under node
        run: |
          entry="$PWD/plugins/openclaw-tps-mail/dist/src/index.js"
          node --input-type=module -e "import('$entry').then(()=>console.log('LOADED')).catch(e=>{console.error(e.code);process.exit(2)})"
      - name: Require the built plugin under node (the gateway loads plugins through a require-style path)
        run: |
          entry="$PWD/plugins/openclaw-tps-mail/dist/src/index.js"
          node -e "try{require('$entry');console.log('REQUIRE_OK')}catch(e){console.error(e.code||'',String(e.message).split('\n')[0]);process.exit(2)}"

  audit:
    name: Dependency Audit
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Check for known vulnerabilities
        run: bun audit

  docker:
    name: Docker Integration
    needs: test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - name: Resolve the pinned nono commit
        id: pin
        run: |
          commit="$(sed -n 's/^commit=//p' .nono-version 2>/dev/null | head -n1)"
          [ -n "$commit" ] || commit="bc1406e9ceb0b765d303a015502fade11f3858f5"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # cli#352 r: Part C runs the supervisor under a REAL nono. The image's
      # distro is bookworm, so the binary is built from the S4 pin (the same
      # .nono-version commit the profile gate builds) inside a bookworm toolchain
      # — a runner-built glibc binary is not guaranteed to run in the container.
      - name: Cache the pinned nono build (container distro)
        id: nono-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.local/nono-pin-bookworm
          key: nono-bookworm-${{ steps.pin.outputs.commit }}
      - name: Build the pinned nono for the container (cache miss)
        if: steps.nono-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p "$HOME/.local/nono-pin-bookworm"
          docker run --rm -v "$HOME/.local/nono-pin-bookworm:/out" -e COMMIT="${{ steps.pin.outputs.commit }}" rust:bookworm bash -c '
            set -eux
            apt-get update && apt-get install -y git libdbus-1-dev pkg-config
            git clone --filter=blob:none https://github.com/nolabs-ai/nono /tmp/nono
            git -C /tmp/nono checkout "$COMMIT"
            test "$(git -C /tmp/nono rev-parse HEAD)" = "$COMMIT"
            cd /tmp/nono && cargo build --release -p nono-cli
            cp target/release/nono /out/nono'
          "$HOME/.local/nono-pin-bookworm/nono" --version
      - name: Run tests in Docker
        run: docker compose run --rm test
      - name: Supervisor harness (Part B fake nono + Part C real nono) in the container
        # Builds the image once (above), then runs the behavioural halves — fake
        # nono logging argv; nono-absent → exit non-zero, no agent started;
        # refusal with an earlier agent running → no orphan; traversal/mismatch
        # roster ids refused; and under the REAL pinned nono: the profile is
        # resolved from the bundled dir with XDG_CONFIG_HOME empty, the probe
        # passes, an agent launches with sandboxChildEnv()'s exports and a HOME it
        # owns, its git ls-remote exits 0, `nono ps` binds the session to the
        # supervisor's child and records the resolved profile path, reverting
        # tps-base's /dev/null allow makes the supervisor refuse everything, no
        # profile at all is a named refusal, and a bare-name resolver refuses the
        # same setup that otherwise launches (cli#352 r2/r3).
        run: docker compose run --rm -v "$HOME/.local/nono-pin-bookworm/nono:/usr/local/bin/nono:ro" test bash scripts/test-tps-office-supervisor.sh

      # cli#350 round 4e — the attested-launch POSITIVE, as a NON-ROOT lane user,
      # against the S4-pinned nono built from .nono-version (same cache key as the
      # profile gate, so the build is usually a cache hit). The fixture skips
      # itself when the pin is absent, so wiring the mount is what makes this lane
      # meaningful — and without it the release path would be untested here.
      - name: Resolve the pinned nono commit (attested lane)
        id: pin-attested
        run: |
          commit="$(sed -n 's/^commit=//p' .nono-version 2>/dev/null | head -n1)"
          [ -n "$commit" ] || commit="bc1406e9ceb0b765d303a015502fade11f3858f5"
          # cli#350 r4g — a PR can edit .nono-version; never trust the value into
          # shell. Require exactly 40 hex (a git object id) before publishing it.
          printf '%s' "$commit" | grep -qE '^[0-9a-fA-F]{40}$' || {
            echo "❌ .nono-version commit= must be exactly 40 hex chars (got: $commit)" >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Cache the pinned nono build
        id: nono-cache-attested
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.local/nono-pin
          key: nono-Linux-${{ steps.pin-attested.outputs.commit }}
      - name: Build the pinned nono (cache miss)
        if: steps.nono-cache-attested.outputs.cache-hit != 'true'
        env:
          NONO_COMMIT: ${{ steps.pin-attested.outputs.commit }}
        run: |
          set -eux
          commit="$NONO_COMMIT"
          sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
          mkdir -p "$HOME/.local/nono-pin"
          rm -rf "$RUNNER_TEMP/nono"
          git clone --filter=blob:none https://github.com/nolabs-ai/nono "$RUNNER_TEMP/nono"
          git -C "$RUNNER_TEMP/nono" checkout "$commit"
          test "$(git -C "$RUNNER_TEMP/nono" rev-parse HEAD)" = "$commit"
          cd "$RUNNER_TEMP/nono"
          cargo build --release -p nono-cli
          cp target/release/nono "$HOME/.local/nono-pin/nono"
      - name: Run the attested-launch positive against the pinned nono (non-root user)
        run: |
          n="$HOME/.local/nono-pin/nono"
          test -x "$n"
          docker compose run --rm \
            -v "$n:/usr/local/bin/nono:ro" \
            -e NONO_BIN=/usr/local/bin/nono \
            attested

  binary-smoke:
    name: Binary Smoke Test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.3.10
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - name: Build CLI package (required by agent compile)
        run: cd packages/cli && bun run build || true
      - name: Build agent package
        run: cd packages/agent && bun run build
      - name: Build compiled binary
        run: |
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          cd packages/cli && bun build --compile bin/tps.ts --target=bun-linux-x64 --define "INJECTED_VERSION=\"$PKG_VERSION\"" --outfile=dist/tps-smoke
      - name: Smoke test
        run: ./packages/cli/dist/tps-smoke --version

  # cli#341 S1b: the nono profile gate is a durable control — wired into CI on
  # both Linux and macOS against the S4-pinned nono build. The commit comes from
  # .nono-version when present (coordinated with cli#345; not duplicated), else
  # the literal pin. Absent/too-old nono makes the gate fail loudly by design.
  nono-profile-gate:
    name: nono profile gate (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: "1.3.10"
      - name: Resolve the pinned nono commit
        id: pin
        run: |
          commit="$(sed -n 's/^commit=//p' .nono-version 2>/dev/null | head -n1)"
          [ -n "$commit" ] || commit="bc1406e9ceb0b765d303a015502fade11f3858f5"
          # cli#350 r4g — a PR can edit .nono-version; never trust the value into
          # shell. Require exactly 40 hex (a git object id) before publishing it.
          printf '%s' "$commit" | grep -qE '^[0-9a-fA-F]{40}$' || {
            echo "❌ .nono-version commit= must be exactly 40 hex chars (got: $commit)" >&2
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Cache the pinned nono build
        id: nono-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.local/nono-pin
          key: nono-${{ matrix.os }}-${{ steps.pin.outputs.commit }}
      - name: Build the pinned nono (cache miss)
        if: steps.nono-cache.outputs.cache-hit != 'true'
        env:
          NONO_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -eux
          commit="$NONO_COMMIT"
          mkdir -p "$HOME/.local/nono-pin"
          rm -rf "$RUNNER_TEMP/nono"
          git clone --filter=blob:none https://github.com/nolabs-ai/nono "$RUNNER_TEMP/nono"
          git -C "$RUNNER_TEMP/nono" checkout "$commit"
          test "$(git -C "$RUNNER_TEMP/nono" rev-parse HEAD)" = "$commit"
          cd "$RUNNER_TEMP/nono"
          cargo build --release -p nono-cli
          cp target/release/nono "$HOME/.local/nono-pin/nono"
      - name: Run the profile gate against the pinned nono
        run: NONO_BIN="$HOME/.local/nono-pin/nono" ./scripts/check-nono-profiles.sh

  # SAST (Static Application Security Testing) using Semgrep.
  # Semgrep scans the codebase for security vulnerabilities, hardcoded secrets, and bad practices
  # using pattern matching. It is fast and catches common mistakes.
  sast-semgrep:
    name: Semgrep SAST
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Known false positives excluded via --exclude-rule flags above
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - run: python3 -m pip install semgrep
      - run: >
          semgrep scan --config=auto --error
          --exclude='**/test/**' --exclude='**/dist/**'
          --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp
          --exclude-rule javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring
          --exclude-rule javascript.node-crypto.security.gcm-no-tag-length.gcm-no-tag-length

  # SAST using CodeQL.
  # CodeQL performs deep semantic code analysis and taint tracking (e.g. tracking unvalidated user
  # input from an API endpoint all the way to a filesystem call). It catches complex logic flaws
  # that pattern-matching tools like Semgrep might miss.
  sast-codeql:
    name: CodeQL SAST
    permissions:
      contents: read
      security-events: write # CodeQL's upload of SARIF results (the "Perform CodeQL Analysis" step)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false # PR-controlled code must not see the token
      - name: Initialize CodeQL
        uses: github/codeql-action/init@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          languages: javascript-typescript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
