name: Real-Flair integration lane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/src/**'
      - 'packages/agent/src/**'
      - 'packages/cli/test/real-flair.test.ts'
      - 'packages/cli/test/agent-create-registration.test.ts'
      - 'packages/cli/test/mail-flair-read-auth.test.ts'
      - 'packages/cli/test/presence-flair-contract.test.ts'
      - 'packages/cli/test/review-trigger-flair.test.ts'
      - 'packages/cli/test/runtime-flair-verify.test.ts'
      - 'packages/cli/test/helpers/**'
      - 'packages/cli/bunfig.toml'
      - 'packages/cli/package.json'
      - 'packages/agent/package.json'
      - 'packages/cli/tsconfig.json'
      - 'packages/agent/tsconfig.json'
      - 'scripts/real-flair-lane.ts'
      - 'scripts/test-suite.mjs'
      - 'scripts/test-home-guard.mjs'
      - 'scripts/home-isolation-preload.ts'
      - 'packages/cli/test/real-flair-lane.test.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/real-flair.yml'

permissions: {}

jobs:
  real-flair:
    name: Real-Flair integration lane
    permissions:
      contents: read # actions/checkout reads the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # the checkout credential is not persisted into .git/config for the steps below
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.10"
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      - name: Real-Flair lane (scratch Flair on a local Harper)
        run: bun scripts/real-flair-lane.ts
