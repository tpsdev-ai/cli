name: Real-Flair integration lane

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/src/**'
      - 'packages/agent/src/**'
      - 'packages/cli/test/real-flair.test.ts'
      - 'packages/cli/test/agent-create-registration.test.ts'
      - 'packages/cli/test/mail-flair-read-auth.test.ts'
      - 'packages/cli/test/presence-flair-contract.test.ts'
      - 'packages/cli/test/review-trigger-flair.test.ts'
      - 'packages/cli/test/runtime-flair-verify.test.ts'
      - 'packages/cli/test/helpers/**'
      - 'packages/cli/bunfig.toml'
      - 'packages/cli/package.json'
      - 'packages/agent/package.json'
      - 'packages/cli/tsconfig.json'
      - 'packages/agent/tsconfig.json'
      - 'scripts/real-flair-lane.ts'
      - 'scripts/test-suite.mjs'
      - 'scripts/test-home-guard.mjs'
      - 'scripts/home-isolation-preload.ts'
      - 'packages/cli/test/real-flair-lane.test.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/real-flair.yml'

permissions: {}

jobs:
  real-flair:
    name: Real-Flair integration lane
    permissions:
      contents: read # actions/checkout reads the repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # the checkout credential is not persisted into .git/config for the steps below
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Attempt cache restore of the verified Socket Firewall binary (cli#898)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sfw-cache
          key: sfw-free-1.15.4-Linux-X64-cf9f55b8343e1ef6e6dcccdb09b99c70c0430a22ed7d0079286eccddeaf72670-c8c80aa582829f24f5d633f2c3f2ccd0b070bbee80bf3b956e5e2a9880184e20-b19f96f0dd3ebc4ecc7111dbc43cc2b095f37bf759273c0bd9c0c4784ea24731-1b705ea7c399727ee41aa93f63e0469d2c3787c50e1dd8842cb8ff5ceec9eb99
      - run: bash scripts/prefetch-socket-firewall.sh
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.4"
      - run: sfw bun install --frozen-lockfile
      - run: bun run build
      - name: Real-Flair lane (scratch Flair on a local Harper)
        run: bun scripts/real-flair-lane.ts
