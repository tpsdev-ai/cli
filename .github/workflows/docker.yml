name: Docker Image

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'TPS version to bake into image (e.g. 0.5.1)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Validate: must be semver-like (digits and dots only)
            if ! echo "$INPUT_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "❌ Invalid version: $INPUT_VERSION" && exit 1
            fi
            echo "tps_version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Read version from package.json (workflow_run trigger)
            V=$(node -p "require('./packages/cli/package.json').version")
            echo "tps_version=$V" >> "$GITHUB_OUTPUT"
            echo "tag=$V" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build (single-platform, loaded locally) so the artifact can be smoked
      # BEFORE anything is pushed (cli#345 r10).
      - name: Build (load, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            TPS_VERSION=${{ steps.version.outputs.tps_version }}
          tags: |
            tps-office-verify:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # THE PRIMARY CONTROL: a Dockerfile shape cannot fake an executed artifact.
      - name: Smoke the built image (primary control)
        run: |
          set -eux
          # 1. the shipped binary executes, without an image shell
          docker run --rm --entrypoint /usr/local/bin/nono tps-office-verify:latest --version | grep -q 'nono 0.74.0'
          # 2. it is a regular file (not a symlink) whose bytes match the pin,
          #    compared ON THE RUNNER HOST
          cid="$(docker create tps-office-verify:latest)"
          docker cp "$cid:/usr/local/bin/nono" ./nono-from-image
          docker rm "$cid" >/dev/null
          test -f ./nono-from-image
          test ! -L ./nono-from-image
          echo "$(cat docker/nono.sha256)  ./nono-from-image" | sha256sum -c -
          # 3. and the in-image path is a regular file too
          docker run --rm --entrypoint sh tps-office-verify:latest -c 'test -f /usr/local/bin/nono && test ! -L /usr/local/bin/nono'
          rm -f ./nono-from-image

      # cli#352 r3/r4 — the ship-red control (S1b/S4 "harness green, ship red"
      # class). The byte smoke above proves the binary's BYTES; this proves the
      # IMAGE can actually run an office agent. It runs the built image itself
      # with a one-agent fixture roster and NO stand-in for tps-agent: the
      # supervisor's `check` pre-flight AND its `start` launch both run the
      # SHIPPED /usr/local/bin/tps-agent. Assertions: (1) the bundled profiles
      # exist in the image at the path the supervisor resolves (a Dockerfile
      # that forgets the COPY is red), (2) nono loads tps-office BY PATH there
      # and the sandbox engages (exit 0), (3) the supervisor's pre-flight passes
      # against the shipped agent and the fixture agent really runs under nono —
      # readiness is the agent's OWN signal, the pid file `tps-agent start`
      # writes — and (4) the supervisor exits 0. An image whose agent predates
      # `check` (the published 0.5.4) goes red on (3): the supervisor refuses
      # with its named pre-flight message, printed from /tmp/sup.log. No profile
      # override is passed, so (1)-(3) cannot be satisfied by the harness
      # supplying the profiles.
      - name: Launch control — the built image resolves its profile and launches an agent
        run: |
          set -eux
          fx="$(mktemp -d "${RUNNER_TEMP:-/tmp}/office-smoke.XXXXXX")"
          # mktemp makes the dir 0700; the sandboxed agent runs as its own uid and
          # must still be able to traverse into its workspace, so widen the mount
          # root (nothing secret lives here — it is a smoke fixture).
          chmod 755 "$fx"
          mkdir -p "$fx/.tps/identity" "$fx/smoke"
          printf '[{"id":"smoke","configPath":"/workspace/smoke/agent.yaml"}]\n' >"$fx/.tps/team.json"
          printf 'agentId: smoke\nname: smoke\nworkspace: /workspace/smoke\nmailDir: /workspace/smoke/mail\nllm:\n  provider: ollama\n  model: x\n' >"$fx/smoke/agent.yaml"
          printf 'KEY' >"$fx/.tps/identity/smoke.key"
          printf 'PUB' >"$fx/.tps/identity/smoke.pub"
          # NO tps-agent shim: the supervisor calls the SHIPPED binary for both
          # `check` and `start`, and readiness is the pid file the real agent
          # writes (see (3)).
          cat >"$fx/.smoke.sh" <<'SMOKE'
          set -eux
          # (1) the profiles the supervisor resolves are IN the image
          test -f /usr/local/share/tps/nono-profiles/tps-office.json
          test -f /usr/local/share/tps/nono-profiles/tps-base.json
          # (2) nono loads tps-office BY PATH and the sandbox engages
          nono run --profile /usr/local/share/tps/nono-profiles/tps-office.json -- true
          # (3) the supervisor resolves its own default bundled path, its
          #     Landlock probe passes, and the SHIPPED tps-agent passes the
          #     pre-flight and launches under nono. Readiness is the agent's OWN
          #     signal — the pid file `tps-agent start` writes
          #     (<workspace>/.tps-agent.pid). An agent without the `check`
          #     subcommand never reaches this point; the supervisor's named
          #     refusal is printed from /tmp/sup.log below.
          mkdir -p /run/secrets && touch /run/secrets/.ready
          tps-office-supervisor >/tmp/sup.log 2>&1 &
          sup=$!
          ready=0
          for _ in $(seq 1 60); do
            [ -f /workspace/smoke/.tps-agent.pid ] && { ready=1; break; }
            kill -0 "$sup" 2>/dev/null || break
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "❌ the real agent never signalled readiness — supervisor log:"
            cat /tmp/sup.log
            exit 1
          fi
          echo "✅ the shipped tps-agent passed check and started (pid $(cat /workspace/smoke/.tps-agent.pid))"
          # (4) the supervisor's exit status is asserted, not just readiness.
          kill -TERM "$sup" 2>/dev/null || true
          if wait "$sup"; then sup_rc=0; else sup_rc=$?; fi
          if [ "$sup_rc" -ne 0 ]; then cat /tmp/sup.log; exit 1; fi
          echo "✅ office image: profile resolved by path, nono engaged, supervisor launched the real agent and exited 0"
          SMOKE
          chmod +x "$fx/.smoke.sh"
          docker run --rm -v "$fx:/workspace" --entrypoint /bin/bash tps-office-verify:latest /workspace/.smoke.sh

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TPS_VERSION=${{ steps.version.outputs.tps_version }}
          tags: |
            ghcr.io/tpsdev-ai/tps-office:${{ steps.version.outputs.tag }}
            ghcr.io/tpsdev-ai/tps-office:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
