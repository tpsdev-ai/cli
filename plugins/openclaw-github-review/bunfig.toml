# bunfig.toml — openclaw-github-review plugin test configuration.
#
# The test PRELOAD below is the launch-time isolation precondition for this
# plugin's suite. It aborts the run unless os.homedir() resolves inside the
# throwaway root the launcher created. Run the suite through the launcher:
#
#   bun run --cwd plugins/openclaw-github-review test
#   node plugins/openclaw-github-review/scripts/run-tests.mjs
#
# A bare `bun test` here aborts by name — that is the point.

[test]
preload = ["./test/preload-guard.ts"]
