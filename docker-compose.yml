# BUN_VERSION is required (`${BUN_VERSION:?...}`): unset or empty is refused.
# Locally, any nonempty value is accepted; the Docker Integration job fails when
# the image's Bun differs from the root package.json packageManager pin.
# Set it with: BUN_VERSION="$(scripts/docker-bun-version.sh)" docker compose build
x-test-build: &test-build
  context: .
  dockerfile: Dockerfile.test
  args:
    BUN_VERSION: "${BUN_VERSION:?BUN_VERSION is unset — export the repository's packageManager pin, see scripts/docker-bun-version.sh}"

services:
  test:
    build: *test-build
    command: bun run test
    environment:
      - HOME=/home/tps
      - TPS_TEST_MODE=docker
    tmpfs:
      - /tmp:exec,size=64M

  integration:
    build: *test-build
    command: bun run test
    environment:
      - HOME=/home/tps
      - TPS_TEST_MODE=docker
    tmpfs:
      - /tmp:exec,size=64M

  # cli#350 round 4e — the POSITIVE, as a NON-ROOT user, against the real
  # S4-pinned nono that CI mounts at /usr/local/bin/nono (NONO_BIN). The fixture
  # skips itself when no real nono is reachable, so this service is only
  # meaningful with the mount — which is exactly how the Docker Integration job
  # runs it.
  #
  # cli#430: the targeted files run through the suite launcher, like every other
  # lane: HOME-isolated, an allowlisted environment, and the repo-root bunfig
  # preload (which aborts a bare `bun test` here). /app is root-owned and this
  # service runs as the non-root `tps` user, so the report goes to the writable
  # tmpfs. The launcher does not pass NONO_BIN or TPS_TEST_MODE to the tests
  # (neither is on its allowlist; NONO_BIN is a path): the fixtures resolve the
  # mounted binary at /usr/local/bin/nono, the first of the pinned locations
  # (DEFAULT_NONO_PATHS in packages/cli/src/utils/launch-attestation.ts).
  attested:
    build: *test-build
    command: node scripts/test-suite.mjs attested packages/cli/test/launch-attestation-real-nono.test.ts packages/cli/test/launch-attestation.test.ts packages/cli/test/runtime-attested-launch.test.ts
    user: tps
    working_dir: /app
    environment:
      - HOME=/home/tps
      - NONO_BIN=/usr/local/bin/nono
      - TPS_TEST_MODE=docker
      - TPS_TEST_REPORT_DIR=/tmp/test-reports
    tmpfs:
      - /tmp:exec,size=64M

  office:
    build: *test-build
    command: /bin/sh
    stdin_open: true
    tty: true
    environment:
      - HOME=/home/tps
      - TPS_TEST_MODE=sandbox
    tmpfs:
      - /tmp:exec,size=64M
